[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "swarms"
version = "16.0.3"
description = "Multi-agent orchestration framework: build agents, workflows and swarms over any LLM"
license = "Apache-2.0"
authors = ["Kye Gomez <kye@swarms.world>"]
homepage = "https://github.com/kyegomez/swarms"
documentation = "https://docs.swarms.world"
readme = "README.md"
repository = "https://github.com/kyegomez/swarms"
keywords = [
    "agents",
    "multi-agent",
    "multi-agent systems",
    "agent framework",
    "agent orchestration",
    "swarms",
    "llm",
    "llm agents",
    "autonomous agents",
    "workflows",
    "tool calling",
    "mcp",
    "generative ai",
    "artificial intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
toml = "*"
loguru = "*"
pydantic = "*"
tenacity = "*"
psutil = "*"
python-dotenv = "*"
PyYAML = "*"
networkx = "*"
rich = "*"
httpx = "*"
requests = "*"
mcp = "*"
schedule = "*"
opentelemetry-sdk = "*"
opentelemetry-exporter-otlp-proto-http = "*"
zstandard = "*"
routehub = { version = ">=0.4.0", extras = ["fast"] }
rustworkx = { version = "*", optional = true }

[tool.poetry.extras]
# rustworkx backs GraphWorkflow(backend="rustworkx") in place of networkx.
fast = ["rustworkx"]

[tool.poetry.scripts]
swarms = "swarms.cli.main:main"


[tool.poetry.group.lint.dependencies]
black = ">=23.1,<27.0"
ruff = ">=0.5.1,<0.16.2"
types-toml = "^0.10.8.1"
types-pytz = ">=2023.3,<2027.0"
types-chardet = "^5.0.4.6"
mypy-protobuf = ">=3,<6"


[tool.poetry.group.test.dependencies]
pytest = ">=8.1.1,<10.0.0"
pytest-asyncio = ">=0.26.0"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "remote: tests that hit a real remote MCP server over the network",
]

[tool.ruff]
line-length = 70

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402", "E721", "E722", "F401", "F402"]
"tests/**" = ["E402", "E721", "E722", "F401", "F402"]
"scripts/**" = ["F401"]

[tool.black]
target-version = ["py38"]
line-length = 70
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
)/
'''

