[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "swarms"
version = "14.0.0"
description = "Swarms - TGSC"
license = "Apache-2.0"
authors = ["Kye Gomez <kye@swarms.world>"]
homepage = "https://github.com/kyegomez/swarms"
documentation = "https://docs.swarms.world"
readme = "README.md"
repository = "https://github.com/kyegomez/swarms"
keywords = [
    "artificial intelligence",
    "deep learning",
    "optimizers",
    "Prompt Engineering",
    "swarms",
    "agents",
    "llms",
    "transformers",
    "multi-agent",
    "swarms of agents",
    "Enterprise-Grade Agents",
    "Production-Grade Agents",
    "Agents",
    "Multi-Grade-Agents",
    "Swarms",
    "Transformers",
    "LLMs",
    "Prompt Engineering",
    "Agents",
    "Generative Agents",
    "Generative AI",
    "Agent Marketplace",
    "Agent Store",
    "quant",
    "finance",
    "algorithmic trading",
    "portfolio optimization",
    "risk management",
    "financial modeling",
    "machine learning for finance",
    "natural language processing for finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
setuptools = "*"
asyncio = ">=3.4.3,<5.0"
toml = "*"
loguru = "*"
pydantic = "*"
tenacity = "*"
psutil = "*"
python-dotenv = "*"
PyYAML = "*"
networkx = "*"
rich = "*"
litellm = "1.76.1"
httpx = "*"
requests = "*"
mcp = ">=1.28.1,<2.0.0"
schedule = "*"
opentelemetry-sdk = "*"
opentelemetry-exporter-otlp-proto-http = "*"

[tool.poetry.scripts]
swarms = "swarms.cli.main:main"


[tool.poetry.group.lint.dependencies]
black = ">=23.1,<27.0"
ruff = ">=0.5.1,<0.16.2"
types-toml = "^0.10.8.1"
types-pytz = ">=2023.3,<2027.0"
types-chardet = "^5.0.4.6"
mypy-protobuf = ">=3,<6"


[tool.poetry.group.test.dependencies]
pytest = ">=8.1.1,<10.0.0"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"

[tool.pytest.ini_options]
markers = [
    "remote: tests that hit a real remote MCP server over the network",
]

[tool.ruff]
line-length = 70

# Library code under swarms/ is held to the full rule set. Example scripts,
# test helpers and one-off scripts are not: an availability probe imports a
# package to see whether it is installed (F401), a demo loads dotenv before
# importing (E402), and a teaching example catches everything so it can print
# a friendly message (E722). Enforcing those there produces churn without
# making the library safer.
[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402", "E721", "E722", "F401", "F402"]
"tests/**" = ["E402", "E721", "E722", "F401", "F402"]
"scripts/**" = ["F401"]

[tool.black]
target-version = ["py38"]
line-length = 70
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
)/
'''

