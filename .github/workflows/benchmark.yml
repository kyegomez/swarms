name: Benchmarks

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "swarms/**"
      - "tests/benchmark*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [ "master" ]
    paths:
      - "swarms/**"
      - "tests/benchmark*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Commit or branch to compare against"
        default: "master"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check out the change
      uses: actions/checkout@v6
      with:
        path: head

    - name: Check out the base
      uses: actions/checkout@v6
      with:
        path: base
        ref: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: head/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r head/requirements.txt

    - name: Compare base and head
      shell: bash
      env:
        SWARMS_TELEMETRY_ON: "false"
      run: |
        python head/tests/benchmark_compare.py \
          --base base --head head --rounds 5 \
          --out benchmark-results.json | tee benchmark-report.md

    - name: Upload the results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: |
          benchmark-results.json
          benchmark-report.md
        retention-days: 30
